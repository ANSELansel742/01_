<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c121e" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="furGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="earGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="8" stroke-opacity="0.3"/>

  <!-- Subtle glow ring -->
  <circle cx="256" cy="265" r="190" fill="none" stroke="#fbbf24" stroke-width="4" stroke-dasharray="14 10" opacity="0.25"/>

  <!-- Left Dog Ear (Flappy) -->
  <path d="M140 180 C110 160 80 230 115 310 C135 355 175 340 170 290 Z" fill="url(#earGrad)" stroke="#92400e" stroke-width="4"/>

  <!-- Right Dog Ear (Flappy) -->
  <path d="M372 180 C402 160 432 230 397 310 C377 355 337 340 342 290 Z" fill="url(#earGrad)" stroke="#92400e" stroke-width="4"/>

  <!-- Dog Head / Face Base -->
  <ellipse cx="256" cy="275" rx="135" ry="120" fill="url(#furGrad)" stroke="#b45309" stroke-width="6"/>

  <!-- Forehead crest -->
  <ellipse cx="256" cy="185" rx="70" ry="45" fill="#fde68a" opacity="0.6"/>

  <!-- Left Eye -->
  <ellipse cx="205" cy="245" rx="18" ry="24" fill="#1e1b18"/>
  <circle cx="211" cy="238" r="8" fill="#ffffff"/>
  <circle cx="201" cy="252" r="3.5" fill="#ffffff" opacity="0.7"/>

  <!-- Right Eye -->
  <ellipse cx="307" cy="245" rx="18" ry="24" fill="#1e1b18"/>
  <circle cx="313" cy="238" r="8" fill="#ffffff"/>
  <circle cx="303" cy="252" r="3.5" fill="#ffffff" opacity="0.7"/>

  <!-- Dog Snout / Muzzle -->
  <ellipse cx="256" cy="305" rx="60" ry="45" fill="#fffbeb"/>

  <!-- Cute Nose -->
  <path d="M236 288 C246 282 266 282 276 288 C282 295 272 312 256 312 C240 312 230 295 236 288 Z" fill="#1e1b18"/>
  <ellipse cx="251" cy="292" rx="4" ry="2" fill="#ffffff" opacity="0.6"/>

  <!-- Mouth line -->
  <path d="M256 312 L256 324" stroke="#1e1b18" stroke-width="4" stroke-linecap="round"/>
  <path d="M232 324 C244 334 256 332 256 324 C256 332 268 334 280 324" fill="none" stroke="#1e1b18" stroke-width="4" stroke-linecap="round"/>

  <!-- Happy Tongue sticking out -->
  <path d="M246 328 C246 348 266 348 266 328 Z" fill="#f43f5e" stroke="#e11d48" stroke-width="2"/>

  <!-- Cheerful Rosy Blush -->
  <ellipse cx="165" cy="285" rx="16" ry="10" fill="#f43f5e" opacity="0.35"/>
  <ellipse cx="347" cy="285" rx="16" ry="10" fill="#f43f5e" opacity="0.35"/>

  <!-- Cute Bone Accessory Badge -->
  <g transform="translate(216, 400)">
    <rect x="10" y="8" width="60" height="14" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="10" cy="8" r="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="10" cy="22" r="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="70" cy="8" r="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="70" cy="22" r="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="40" y="19" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#0f172a" text-anchor="middle">DOG AI</text>
  </g>
</svg>
